name: Build Mu-Silicium UEFI for Galaxy J7 Neo (from gtaxllte)

# Put this file in your repo at .github/workflows/build-j7neo-uefi.yml
# Then: Actions tab -> "Build Mu-Silicium UEFI for Galaxy J7 Neo" -> Run workflow

on:
  workflow_dispatch:
    inputs:
      width:
        description: "Screen width (J7 Neo = 720)"
        default: "720"
      height:
        description: "Screen height (J7 Neo = 1280)"
        default: "1280"
      build_mode:
        description: "Build mode"
        default: "RELEASE"
        type: choice
        options: [RELEASE, DEBUG]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Clone Mu-Silicium (with submodules)
        run: |
          git clone https://github.com/Project-Silicium/Mu-Silicium.git --recursive
          echo "Mu-Silicium commit: $(git -C Mu-Silicium rev-parse HEAD)"

      - name: Install build environment
        working-directory: Mu-Silicium
        run: |
          ls -la
          chmod +x setup_env.sh build_uefi.* 2>/dev/null || true
          ./setup_env.sh -p apt

      - name: Locate gtaxllte device files
        working-directory: Mu-Silicium
        run: |
          echo "--- files/folders named gtaxllte ---"
          find . -ipath '*gtaxllte*' -not -path './.git/*' | head -50
          if [ -z "$(find . -ipath '*gtaxllte*' -not -path './.git/*' | head -1)" ]; then
            echo "::error::gtaxllte not found in this Mu-Silicium version. Check the Platforms/ folder for the correct codename."
            exit 1
          fi

      - name: Patch resolution to J7 Neo
        working-directory: Mu-Silicium
        env:
          W: ${{ inputs.width }}
          H: ${{ inputs.height }}
        run: |
          python3 -I - <<'PY'
          import os, re, sys

          W, H = os.environ["W"], os.environ["H"]
          # Any PCD / macro that carries the panel size
          horiz = re.compile(r'(?i)^(\s*\S*(?:Horizontal|Width)\S*\s*\|\s*)(0x[0-9a-f]+|\d+)(.*)$')
          vert  = re.compile(r'(?i)^(\s*\S*(?:Vertical|Height)\S*\s*\|\s*)(0x[0-9a-f]+|\d+)(.*)$')

          # Device files = every file under a path containing "gtaxllte"
          targets = []
          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  if "gtaxllte" in p.lower() and f.lower().endswith((".dsc", ".inc", ".conf", ".dsc.inc", ".fdf", ".h", ".c")):
                      targets.append(p)

          changed = 0
          for p in targets:
              try:
                  lines = open(p, encoding="utf-8", errors="replace").read().split("\n")
              except Exception:
                  continue
              out = []
              for ln in lines:
                  m = horiz.match(ln)
                  n = vert.match(ln)
                  if m and "Pcd" in ln:
                      new = f"{m.group(1)}{W}{m.group(3)}"
                      print(f"{p}: {ln.strip()}  ->  {new.strip()}")
                      ln = new; changed += 1
                  elif n and "Pcd" in ln:
                      new = f"{n.group(1)}{H}{n.group(3)}"
                      print(f"{p}: {ln.strip()}  ->  {new.strip()}")
                      ln = new; changed += 1
                  out.append(ln)
              open(p, "w", encoding="utf-8").write("\n".join(out))

          print(f"\n{changed} resolution lines changed in {len(targets)} files")
          if changed == 0:
              print("::warning::No resolution PCDs found in gtaxllte files. Check the log above and patch manually.")
          PY

          echo "--- every resolution-looking line in the device folder (review these!) ---"
          grep -rniE 'Horizontal|Vertical|Resolution|Stride|FrameBuffer|FbAddr|Width|Height' $(find . -ipath '*gtaxllte*' -type f -not -path './.git/*') || true

      - name: Compile
        working-directory: Mu-Silicium
        run: |
          touch ../build-start.marker
          # Newer Mu-Silicium uses build_uefi.py, older uses build_uefi.sh
          if [ -f build_uefi.py ]; then
            python3 build_uefi.py -d gtaxllte -r ${{ inputs.build_mode }}
          else
            ./build_uefi.sh -d gtaxllte -r ${{ inputs.build_mode }}
          fi

      - name: Collect output
        run: |
          mkdir -p out
          find Mu-Silicium -type f \( -name '*.img' -o -name '*.tar' -o -name '*.bin' \) \
            -newer build-start.marker -not -path '*/.git/*' -print -exec cp {} out/ \;
          cd out
          for f in *; do mv "$f" "j7neo-${f}"; done
          ls -la

      - name: Upload UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: mu-silicium-j7neo-${{ inputs.build_mode }}
          path: out/*
          if-no-files-found: error
