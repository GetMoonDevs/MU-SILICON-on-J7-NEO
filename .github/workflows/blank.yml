name: Build UEFI for Samsung Galaxy J7 Neo (SM-J701F)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "UEFI build mode"
        required: true
        type: choice
        default: RELEASE
        options:
          - RELEASE
          - DEBUG

jobs:
  build:
    name: Build J7 Neo UEFI, 720x1280
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Clone Mu-Silicium and submodules
        run: |
          git clone --recursive https://github.com/Project-Silicium/Mu-Silicium.git
          echo "Mu-Silicium commit: $(git -C Mu-Silicium rev-parse HEAD)"

      - name: Install build environment
        working-directory: Mu-Silicium
        run: |
          chmod +x setup_env.sh build_uefi.* 2>/dev/null || true
          ./setup_env.sh -p apt

      - name: Configure J7 Neo identity and native display resolution
        working-directory: Mu-Silicium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = list(Path("Platforms").rglob("gtaxllte.dsc"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one gtaxllte.dsc, found {len(candidates)}")
          path = candidates[0]
          text = path.read_text(encoding="utf-8")

          replacements = {
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdSmbiosSystemModel\\|)".*?"$':
                  r'\\1"Galaxy J7 Neo (SM-J701F)"',
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdSmbiosSystemRetailModel\\|)".*?"$':
                  r'\\1"j7velte"',
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdSmbiosSystemRetailSku\\|)".*?"$':
                  r'\\1"SM-J701F_j7velte"',
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdSmbiosSystemBoardModel\\|)".*?"$':
                  r'\\1"SM-J701F"',
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdFrameBufferWidth\\|)\\d+\\s*$':
                  r'\\g<1>720',
              r'(?m)^(\\s*gSiliciumPkgTokenSpaceGuid\\.PcdFrameBufferHeight\\|)\\d+\\s*$':
                  r'\\g<1>1280',
          }

          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f"Patch failed: expected one match, got {count}: {pattern}")

          if "PcdFrameBufferWidth|720" not in text or "PcdFrameBufferHeight|1280" not in text:
              raise SystemExit("J7 Neo framebuffer resolution verification failed")

          path.write_text(text, encoding="utf-8")
          print(f"Patched {path}")
          print("SMBIOS identity: Samsung Galaxy J7 Neo, SM-J701F, j7velte")
          print("UEFI framebuffer: 720x1280, 32-bit")
          PY

          echo "=== Applied J7 Neo display settings ==="
          grep -nE 'PcdSmbiosSystem(Model|RetailModel|RetailSku|BoardModel)|PcdFrameBuffer(Width|Height|ColorDepth)' $(find Platforms -name gtaxllte.dsc -print)

      - name: Build firmware
        working-directory: Mu-Silicium
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          if [ -f build_uefi.py ]; then
            python3 build_uefi.py -d gtaxllte -r "$BUILD_MODE"
          elif [ -f build_uefi.sh ]; then
            chmod +x build_uefi.sh
            ./build_uefi.sh -d gtaxllte -r "$BUILD_MODE"
          else
            echo "::error::No supported Mu-Silicium build script found"
            exit 1
          fi

      - name: Collect firmware and build information
        run: |
          mkdir -p out
          find Mu-Silicium -type f \\( -name '*.img' -o -name '*.tar' -o -name '*.bin' -o -name '*.efi' \\) -not -path '*/.git/*' -print -exec cp --parents {} out/ \;
          cat > out/J7NEO-BUILD-INFO.txt <<'EOF'
          Target device: Samsung Galaxy J7 Neo
          Model: SM-J701F
          Device codename: j7velte
          SoC: Samsung Exynos 7870
          Native panel/framebuffer resolution: 720x1280
          Framebuffer color depth: 32-bit
          Build base: Project-Silicium Mu-Silicium gtaxllte platform package
          Important: this is a J7 Neo display/identity-configured experimental build. The upstream gtaxllte platform package is still the hardware bring-up base. USB host, touchscreen, panel initialization, and OTG power are not confirmed by this workflow.
          EOF
          find out -type f -maxdepth 8 -print
          test -n "$(find out -type f \\( -name '*.img' -o -name '*.tar' -o -name '*.bin' -o -name '*.efi' \\) -print -quit)"

      - name: Upload J7 Neo UEFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: J7NEO-SM-J701F-720x1280-${{ inputs.build_mode }}
          path: out/
          if-no-files-found: error
